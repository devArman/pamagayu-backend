# Drop-in nginx snippet for the Forge site config.
#
# Forge → Sites → pamagayu-backend → Nginx Configuration → paste this
# inside the existing `server { ... }` block (anywhere alongside the other
# location entries), then click "Save" and reload nginx.
#
# Caches /storage/videos/* and /storage/thumbs/* aggressively (30 days)
# since their URLs are stable after re-encoding. This makes repeat playback
# hit the browser/edge cache instead of nginx, and trims access-log noise.
#
# nginx serves these symlinked static files directly with Accept-Ranges: bytes
# already, so range requests (ExoPlayer seek) work without further config.

location ~ ^/storage/(videos|thumbs)/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    access_log off;
    try_files $uri =404;
}
